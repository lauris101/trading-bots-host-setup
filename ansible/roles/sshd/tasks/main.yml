# SSH is the only door (the security group admits nothing else), so it is a
# narrow one: keys only, no root, named users only.
- name: The sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: sshd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-trading-host.conf
    mode: "0600"
    content: |
      # Managed by ansible (trading-bots-host-setup). Keys only, named users only.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      # The account ansible is connected as is always allowed, whatever
      # sshd_allow_users says. Leaving it out locks the playbook out of the
      # host it is halfway through configuring -- and the symptom is not a
      # refused login, it is the next reboot handler hanging until it times
      # out, because the existing connection keeps working until then.
      AllowUsers {{ (sshd_allow_users + [ansible_user]) | unique | join(' ') }}
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3
      LoginGraceTime 20
      # Unauthenticated connections in flight: start dropping at 10, all at 30.
      MaxStartups 10:50:30
      PerSourceMaxStartups 5
      PerSourceNetBlockSize 32:64
      ClientAliveInterval 60
      ClientAliveCountMax 3
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: The cloud image's own drop-ins do not override ours
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
  register: sshd_dropins

- name: Any drop-in that still allows passwords is disabled
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(\s*PasswordAuthentication\s+yes)'
    replace: '# \1  (disabled by ansible)'
  loop: "{{ sshd_dropins.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path != '/etc/ssh/sshd_config.d/10-trading-host.conf'
  notify: Reload sshd
