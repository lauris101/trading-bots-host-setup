# CrowdSec: the security engine reads sshd's journal, and the nftables
# bouncer drops the offending source for hours; the engine also pulls the
# community blocklist, so addresses seen brute-forcing elsewhere are dropped
# before their first attempt here. Port 22 is open to the internet (no
# static IP on the laptop), so this is the layer that makes that tolerable,
# with sshd itself key-only.
#
# Packages come from CrowdSec's own repository (crowdsec_repo_suite names
# the Debian release): Debian's own crowdsec package is 1.4 from 2023, too
# old to take current hub collections.
# The repository is Debian's, so the suite is a DEBIAN release name. Setting
# an Ubuntu codename is the easy mistake and it does not fail here -- it
# fails later, as a 404 from `apt update` in the middle of a provision. Ask
# the repository up front instead, which also catches a suite that has been
# withdrawn and tells us when trixie finally appears.
- name: CrowdSec's repository serves the configured suite
  ansible.builtin.uri:
    url: "{{ crowdsec_repo_uri }}/dists/{{ crowdsec_repo_suite }}/Release"
    method: HEAD
    status_code: [200, 302]
  register: crowdsec_suite_probe
  failed_when: false
  changed_when: false
  # A read, and the one thing a dry run most needs to tell you.
  check_mode: false

- name: The suite is one the repository has
  ansible.builtin.assert:
    that:
      - crowdsec_suite_probe.status in [200, 302]
    fail_msg: >-
      crowdsec_repo_suite is "{{ crowdsec_repo_suite }}", which
      {{ crowdsec_repo_uri }} does not serve (HTTP
      {{ crowdsec_suite_probe.status | default('no answer') }}). It takes a
      Debian release name; an Ubuntu codename such as noble is the usual
      mistake. bookworm's packages are static Go binaries and run on trixie
      unchanged, so bookworm is the answer until trixie appears.
    success_msg: "{{ crowdsec_repo_suite }}"

- name: nftables is present (the bouncer drives it)
  ansible.builtin.apt:
    name: nftables
    state: present

- name: CrowdSec's apt repository
  ansible.builtin.deb822_repository:
    name: crowdsec
    types: [deb]
    uris: "{{ crowdsec_repo_uri }}"
    suites: ["{{ crowdsec_repo_suite }}"]
    components: [main]
    architectures: ["{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"]
    signed_by: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    state: present
  register: crowdsec_repo

- name: Security engine
  ansible.builtin.apt:
    name: crowdsec
    state: present
    update_cache: "{{ crowdsec_repo.changed }}"

- name: CrowdSec drop-in directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/crowdsec/acquis.d
    - /etc/crowdsec/parsers/s02-enrich

- name: sshd is read from the journal (Debian 13 has no /var/log/auth.log without rsyslog)
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.d/sshd-journal.yaml
    mode: "0644"
    content: |
      # Managed by ansible (trading-bots-host-setup).
      source: journalctl
      journalctl_filter:
        - "_SYSTEMD_UNIT=ssh.service"
      labels:
        type: syslog
  notify: Restart crowdsec

- name: The main acquisition file exists (the package writes one only when its wizard finds logs; the engine expects the path)
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.yaml
    mode: "0644"
    force: false
    content: |
      # Managed by ansible (trading-bots-host-setup): acquisitions live in acquis.d/.
  notify: Restart crowdsec

- name: The file-based sshd acquisition the package guesses is disabled if it points at files that do not exist
  ansible.builtin.replace:
    path: /etc/crowdsec/acquis.yaml
    regexp: '^(\s*-\s*/var/log/auth\.log.*)$'
    replace: '# \1  (journal instead; ansible)'
  notify: Restart crowdsec

- name: Hub index is current
  ansible.builtin.command: cscli hub update
  changed_when: false

- name: Collections for a Linux host running sshd
  ansible.builtin.command: cscli collections install {{ item }}
  register: coll
  changed_when: "'already' not in coll.stdout and 'already' not in coll.stderr and 'Nothing to do' not in coll.stdout"
  loop:
    - crowdsecurity/linux
    - crowdsecurity/sshd
  notify: Restart crowdsec

- name: Addresses never to ban (the dev box, anything with a fixed IP you trust)
  ansible.builtin.copy:
    dest: /etc/crowdsec/parsers/s02-enrich/99-trading-whitelist.yaml
    mode: "0644"
    content: |
      # Managed by ansible (trading-bots-host-setup).
      name: trading/whitelist
      description: "addresses that are never banned"
      whitelist:
        reason: "trusted operator addresses"
        cidr:
      {% for c in crowdsec_whitelist_cidrs %}
          - "{{ c }}"
      {% endfor %}
  when: crowdsec_whitelist_cidrs | length > 0
  notify: Restart crowdsec

- name: No whitelist file when the list is empty
  ansible.builtin.file:
    path: /etc/crowdsec/parsers/s02-enrich/99-trading-whitelist.yaml
    state: absent
  when: crowdsec_whitelist_cidrs | length == 0
  notify: Restart crowdsec

# CrowdSec's local API defaults to 127.0.0.1:8080, the port control
# publishes on the trading host. Move it (both the server side and the two
# clients: the agent's credentials file and, below, the bouncer).
- name: Local API listens on {{ crowdsec_lapi_port }}, not 8080
  ansible.builtin.replace:
    path: /etc/crowdsec/config.yaml
    regexp: '^(\s*listen_uri:\s*)127\.0\.0\.1:\d+'
    replace: '\g<1>127.0.0.1:{{ crowdsec_lapi_port }}'
  notify: Restart crowdsec

- name: The agent reaches the local API there
  ansible.builtin.replace:
    path: /etc/crowdsec/local_api_credentials.yaml
    regexp: '^(url:\s*http://127\.0\.0\.1:)\d+'
    replace: '\g<1>{{ crowdsec_lapi_port }}'
  notify: Restart crowdsec

- name: Apply the port change before anything registers against the API
  ansible.builtin.meta: flush_handlers

- name: Engine is running
  ansible.builtin.service:
    name: crowdsec
    state: started
    enabled: true
  # In --check the package or unit this needs was not actually
  # created, so a dry run has nothing to inspect and would fail on a
  # fresh host. It cannot answer this one; it must not fail on it.
  when: not ansible_check_mode

- name: Firewall bouncer (nftables). Its postinst registers it with the local API.
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer-nftables
    state: present

- name: Bouncer drops (not rejects), leaves IPv6 alone, talks to the API on its port
  ansible.builtin.lineinfile:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: "^{{ item.key }}:"
    line: "{{ item.key }}: {{ item.value }}"
  loop:
    - { key: mode, value: nftables }
    - { key: deny_action, value: DROP }
    - { key: disable_ipv6, value: "true" }
    - { key: api_url, value: "http://127.0.0.1:{{ crowdsec_lapi_port }}/" }
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  notify: Restart bouncer

- name: Bouncer is running
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    state: started
    enabled: true
  # In --check the package or unit this needs was not actually
  # created, so a dry run has nothing to inspect and would fail on a
  # fresh host. It cannot answer this one; it must not fail on it.
  when: not ansible_check_mode

- name: Enroll in the CrowdSec console when a key is given (optional; view alerts in a browser)
  ansible.builtin.command: cscli console enroll --name {{ host_name }} {{ crowdsec_enroll_key }}
  when: crowdsec_enroll_key | length > 0
  register: enroll
  changed_when: "'already enrolled' not in enroll.stdout and 'already enrolled' not in enroll.stderr"
  failed_when: enroll.rc != 0 and 'already' not in enroll.stderr
  notify: Restart crowdsec

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: What the engine sees
  ansible.builtin.command: cscli metrics show acquisition bouncers
  changed_when: false
  register: cs_metrics

- name: Show it
  ansible.builtin.debug:
    msg: "{{ cs_metrics.stdout_lines }}"
