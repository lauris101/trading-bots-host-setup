# The key pair the host uses to clone its repository from GitHub, generated on
# the host (the private half never travels). Added on GitHub as a read-only
# deploy key: repository, Settings, Deploy keys.
github_deploy_key_file: "/home/{{ trading_bot_user }}/.ssh/id_ed25519_github"
github_deploy_key_comment: "{{ inventory_hostname }} github deploy key"
