# The account the stack runs under, with the SSH key you chose.
- name: Resolve the public key (a key line, or a path to a .pub file)
  ansible.builtin.set_fact:
    trading_bot_public_key_line: >-
      {{ trading_bot_public_key
         if trading_bot_public_key is match('^(ssh-|ecdsa-|sk-)')
         else lookup('ansible.builtin.file', trading_bot_public_key | expanduser) }}
  delegate_to: localhost
  become: false
  run_once: true

- name: The key line looks like an OpenSSH public key
  ansible.builtin.assert:
    that:
      - trading_bot_public_key_line is match('^(ssh-(ed25519|rsa)|ecdsa-sha2-nistp[0-9]+|sk-[a-z0-9-]+@openssh.com) [A-Za-z0-9+/=]+')
    fail_msg: "trading_bot_public_key is not an OpenSSH public key line (got: {{ trading_bot_public_key_line[:40] }}...)"

- name: Account exists
  ansible.builtin.user:
    name: "{{ trading_bot_user }}"
    comment: trading-bots stack
    shell: /bin/bash
    create_home: true
    groups: []
    append: true
    password_lock: true

- name: The CI deploy key looks like an OpenSSH public key and has a command
  ansible.builtin.assert:
    that:
      - ci_deploy_public_key is match('^(ssh-(ed25519|rsa)|ecdsa-sha2-nistp[0-9]+|sk-[a-z0-9-]+@openssh.com) [A-Za-z0-9+/=]+')
      - ci_deploy_command | length > 0
    fail_msg: "ci_deploy_public_key must be an OpenSSH public key line and ci_deploy_command the one command it may run"
  when: ci_deploy_public_key | length > 0

# The CI key can do exactly one thing: sshd ignores what the client asks and
# runs ci_deploy_command (the request arrives in SSH_ORIGINAL_COMMAND).
- name: Authorized keys are exactly the ones configured
  ansible.posix.authorized_key:
    user: "{{ trading_bot_user }}"
    key: >-
      {{ trading_bot_public_key_line }}{% if ci_deploy_public_key | length > 0 %}

      command="{{ ci_deploy_command }}",no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty {{ ci_deploy_public_key }}{% endif %}
    exclusive: true

- name: Passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ trading_bot_user }}
    mode: "0440"
    content: "{{ trading_bot_user }} ALL=(ALL) NOPASSWD: ALL\n"
    validate: /usr/sbin/visudo -cf %s
  when: trading_bot_sudo | bool

- name: No sudo when disabled
  ansible.builtin.file:
    path: /etc/sudoers.d/{{ trading_bot_user }}
    state: absent
  when: not (trading_bot_sudo | bool)

- name: Data root the stack mounts (DATA_BASE_DIR), owner only
  ansible.builtin.file:
    path: "{{ data_base_dir }}/data/trading-bots"
    state: directory
    owner: "{{ trading_bot_user }}"
    group: "{{ trading_bot_user }}"
    mode: "0750"

# World-readable: fluentd (root) writes the files, control (uid 10001 in
# its image) reads them for the UI's Logs tab. Nothing secret is logged.
- name: Log root the stack mounts (LOGS_BASE_DIR), readable by the services
  ansible.builtin.file:
    path: "{{ logs_base_dir }}/logs/trading-bots"
    state: directory
    owner: "{{ trading_bot_user }}"
    group: "{{ trading_bot_user }}"
    mode: "0755"

- name: Hyperliquid key directory, owner-only (the key itself is placed by hand, never by this repo)
  ansible.builtin.file:
    path: /home/{{ trading_bot_user }}/.config/hl
    state: directory
    owner: "{{ trading_bot_user }}"
    group: "{{ trading_bot_user }}"
    mode: "0700"
