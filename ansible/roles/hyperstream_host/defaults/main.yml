# EXPERIMENTAL: the host side of the hyperstream producer (trading-bots
# branch hyperstream). Off unless vars.yml says otherwise.
hyperstream_enabled: false
# Bind the second ENI to vfio-pci so Seastar's native stack drives it with
# DPDK. false: the interface is left to the kernel (the producer runs on the
# kernel stack; the ENI is idle).
hyperstream_dpdk: false
# 2 MB hugepages reserved at boot for DPDK's mempools. 512 = 1 GiB.
hyperstream_hugepages_2m: 512
# The isolated cores the producer's shards pin to (its container's cpuset).
# Must be inside hotpath_isolated_cpus and disjoint from the bot's pins.
hyperstream_cpus: "2-3"
