# Keep the kernel off the bot's cores and tune the network stack. The
# kernel command line change needs a reboot; this role reboots only when it
# actually changed the line (a fresh host, or a new hotpath_isolated_cpus).
- name: The grub drop-in directory exists
  ansible.builtin.file:
    path: /etc/default/grub.d
    state: directory
    mode: "0755"

# isolcpus=domain: the scheduler never places a task on the isolated cores
# by itself. managed_irq: kernel-managed device interrupts (the NIC queues)
# avoid them. irqaffinity: every other interrupt's default is the
# housekeeping set. nohz_full / rcu_nocbs: no tick, no RCU callbacks there.
- name: Kernel keeps off the isolated cores (isolcpus, managed_irq, irqaffinity, nohz_full, rcu_nocbs)
  ansible.builtin.copy:
    dest: /etc/default/grub.d/90-trading-hotpath.cfg
    mode: "0644"
    content: |
      # Managed by ansible (trading-bots-host-setup). Match BOT_CPUSET in trading-bots/.env.
      GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX isolcpus=domain,managed_irq,{{ hotpath_isolated_cpus }} nohz_full={{ hotpath_isolated_cpus }} rcu_nocbs={{ hotpath_isolated_cpus }} irqaffinity={{ hotpath_housekeeping_cpus }}"
  register: grub_dropin

- name: Regenerate the grub config
  ansible.builtin.command: update-grub
  when: grub_dropin.changed
  changed_when: true
  notify: Reboot for the new kernel command line

# irqbalance would migrate interrupts back onto the isolated cores over time.
- name: irqbalance leaves the isolated cores alone
  ansible.builtin.lineinfile:
    path: /etc/default/irqbalance
    create: true
    mode: "0644"
    regexp: '^IRQBALANCE_BANNED_CPULIST='
    line: 'IRQBALANCE_BANNED_CPULIST={{ hotpath_isolated_cpus }}'
  notify: Restart irqbalance if present

# Network interrupts onto the housekeeping cores, now and after every boot
# (affinity does not persist).
- name: IRQ affinity script
  ansible.builtin.copy:
    src: bot-irq-affinity.sh
    dest: /usr/local/sbin/bot-irq-affinity.sh
    mode: "0755"

- name: IRQ affinity unit
  ansible.builtin.template:
    src: bot-irq-affinity.service.j2
    dest: /etc/systemd/system/bot-irq-affinity.service
    mode: "0644"
  register: irq_unit

- name: systemd sees the unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: irq_unit.changed

- name: IRQ affinity applied now and enabled at boot
  ansible.builtin.systemd:
    name: bot-irq-affinity.service
    enabled: true
    state: restarted

- name: Network and memory sysctls for a latency-sensitive box
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-trading-hotpath.conf
    reload: true
  loop:
    # Socket buffers large enough that a burst from a venue never drops.
    - { name: net.core.rmem_max, value: "16777216" }
    - { name: net.core.wmem_max, value: "16777216" }
    - { name: net.core.rmem_default, value: "1048576" }
    - { name: net.core.netdev_max_backlog, value: "16384" }
    - { name: net.ipv4.tcp_rmem, value: "4096 1048576 16777216" }
    - { name: net.ipv4.tcp_wmem, value: "4096 1048576 16777216" }
    # No slow-start after idle: the order socket is idle most of the time
    # and then wants full speed on the first packet.
    - { name: net.ipv4.tcp_slow_start_after_idle, value: "0" }
    - { name: net.ipv4.tcp_no_metrics_save, value: "1" }
    - { name: net.ipv4.tcp_fastopen, value: "3" }
    # Swap is a latency cliff; the box has 16 GiB and no swap device anyway.
    - { name: vm.swappiness, value: "1" }
  loop_control:
    label: "{{ item.name }}={{ item.value }}"

- name: Current kernel command line
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: cmdline

- name: Isolation already active, or a reboot is pending
  ansible.builtin.debug:
    msg: >-
      {{ 'isolation active in the running kernel'
         if ('isolcpus=' ~ hotpath_isolated_cpus) in (cmdline.content | b64decode)
         else 'isolation not in the running kernel yet (reboot pending at the end of the play)' }}
