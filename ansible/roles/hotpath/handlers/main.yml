- name: Reboot for the new kernel command line
  ansible.builtin.reboot:
    msg: "trading-host: rebooting for isolcpus (ansible)"
    reboot_timeout: 300
    post_reboot_delay: 10

- name: Restart irqbalance if present
  ansible.builtin.systemd:
    name: irqbalance
    state: restarted
  failed_when: false
