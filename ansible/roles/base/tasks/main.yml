# OS baseline: packages the deploy scripts expect, time, hostname, updates.
- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ host_name }}"

- name: Hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ host_name }}"

# A Mac's ssh forwards LC_* set to en_US.UTF-8; the cloud image ships only
# C.UTF-8, so every shell prints locale warnings until the locale exists.
- name: The locales package is present
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: en_US.UTF-8 is generated
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: System default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    mode: "0644"
    content: |
      LANG=en_US.UTF-8
      LC_ALL=en_US.UTF-8

- name: cloud-init's locale warning is off
  ansible.builtin.file:
    path: /var/lib/cloud/instance/locale-check.skip
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when: ansible_facts.system_vendor == "Amazon EC2"

- name: Timezone is UTC (the logs, the venues and the database all speak UTC)
  community.general.timezone:
    name: Etc/UTC

- name: Apt cache is fresh
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  # Runs even in --check: it only downloads package lists, and without them
  # a dry run on a fresh image cannot evaluate the package tasks below.
  check_mode: false

- name: Packages the stack's scripts and an operator need
  ansible.builtin.apt:
    name:
      - sudo
      - git
      - just
      - jq
      - curl
      - openssl
      - zstd
      - unzip
      - chrony
      - unattended-upgrades
      - htop
      - iproute2
      - ethtool
      - linux-cpupower
      - python3
      # The deb822_repository module (docker, crowdsec roles) needs it on the host.
      - python3-debian
    state: present

- name: Drop-in directories exist (a minimal image ships without some of them)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/chrony/sources.d
    - /etc/systemd/journald.conf.d
    - /etc/apt/apt.conf.d
    - /etc/apt/keyrings

- name: On EC2, chrony syncs from the Amazon Time Sync Service (link-local, no internet hop)
  ansible.builtin.copy:
    dest: /etc/chrony/sources.d/aws.sources
    mode: "0644"
    content: |
      # Amazon Time Sync Service: a stratum-1 source on the instance's own link.
      server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
  when: ansible_facts.system_vendor == "Amazon EC2"
  notify: Restart chrony

- name: Elsewhere, no Amazon source (Debian's pool from the package config does the job)
  ansible.builtin.file:
    path: /etc/chrony/sources.d/aws.sources
    state: absent
  when: ansible_facts.system_vendor != "Amazon EC2"
  notify: Restart chrony

- name: Chrony is running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Unattended security upgrades, no automatic reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52trading-host
    mode: "0644"
    content: |
      // Security updates install themselves; the box never reboots on its own.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Journald keeps a bounded amount of logs (the services log to files via fluentd anyway)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=500M
      MaxRetentionSec=14day
  notify: Restart journald
